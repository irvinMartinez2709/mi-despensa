name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: Web

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar web (tsc + vite)
        run: npm run build

      - name: Crear proyecto Android (Capacitor)
        run: |
          npx cap add android
          npx cap sync android

      - name: Generar iconos de la app (Mi Despensa)
        run: |
          npm install --no-save sharp
          node scripts/generar-iconos.mjs

      - name: Versión desde package.json
        id: meta
        run: |
          VER="$(node -p "require('./package.json').version")"
          MAJOR="${VER%%.*}"; REST="${VER#*.}"
          MINOR="${REST%%.*}"; PATCH="${REST#*.}"
          CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Mi Despensa $VER (versionCode $CODE)"

      - name: Aplicar versión al build.gradle
        env:
          VER: ${{ steps.meta.outputs.version }}
          CODE: ${{ steps.meta.outputs.code }}
        run: |
          sed -i "s/versionCode 1/versionCode ${CODE}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VER}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle | head -2

      - name: Asegurar platform SDK 34
        run: |
          if [ ! -d "${ANDROID_HOME}/platforms/android-34" ]; then
            sdkmanager "platforms;android-34" "build-tools;34.0.0"
          fi
          ls "${ANDROID_HOME}/platforms"

      - name: Configurar firma (release con keystore secreto)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Sin keystore configurado: se usará la firma debug."
            echo "con_firma=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/midespensa.keystore
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("midespensa.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          GRADLE
          echo "con_firma=true" >> "$GITHUB_ENV"
          echo "Firma release configurada."

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          if [ "$con_firma" = "true" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Empaquetar APK
        env:
          VER: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p ../apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            SRC=android/app/build/outputs/apk/release/app-release.apk
          else
            SRC=android/app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$SRC" "../apk/MiDespensa-${VER}.apk"
          ls -lh "../apk/MiDespensa-${VER}.apk"

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: midespensa-apk
          path: apk/*.apk
          if-no-files-found: error

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Mi Despensa v${{ steps.meta.outputs.version }}
          body_path: Web/RELEASE.md
          files: apk/*.apk
          make_latest: true
